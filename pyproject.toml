[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecograph"
version = "0.1.0"
description = "Ecograph ESG analytics, knowledge graph, and ingestion tooling."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ecograph"}]
license = {text = "MIT"}
keywords = ["esg", "knowledge-graph", "graph", "ingestion", "llm", "satellite", "data"]

dependencies = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "google-generativeai>=0.8.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.34.0",
  "neo4j>=5.19.0",
  "langchain-neo4j",
  "qdrant-client>=1.9.0",
  "unstructured[all-docs]>=0.14.0",
  "unstructured-client>=0.25.0",
  "unstructured[pdf]",
  "unstructured_inference>=0.7.0",
  "earthengine-api",
  "splink",
  "datasets>=2.19.0",
  "requests>=2.31.0",
  "rapidfuzz>=3.9.0",
  "streamlit",
  "python-dotenv>=1.0.0",
  "pandas>=2.2.0",
  "geopandas>=0.14.0",
  "rasterio>=1.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ecograph" = ["*.json", "*.yaml", "*.yml"]
